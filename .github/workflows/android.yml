name: Android CI

# The GoatTV-Mobile repository: ONE source tree, FOUR Mobile apps — GoatTV, AllAccess, 5Star Ultra and
# Supreme TV — each its own applicationId, all signed with the one Mobile-only production key.
#
# Jobs:
#   verify-pin — core pin bumps ONLY. Seconds, no build. See its own note.
#   check      — unit tests (all four brands) + lint. Gates everything after it.
#   plan       — works out which brands to build and at what version, from the tag or the manual run.
#   build      — one signed release APK per planned brand, each proven to be the right package, the
#                right version and the right certificate before it is kept.
#   release    — on a brand tag only: a DRAFT GitHub Release carrying that brand's one APK.
#
# Every brand has its own release track, so a tag names exactly one brand:
#   goattv-mobile-v1.0.0       -> GoatTV-Mobile-v1.0.0.apk       (tv.goat.tv.mobile)
#   allaccess-mobile-v1.0.0    -> AllAccess-Mobile-v1.0.0.apk    (tv.allaccess.app.mobile)
#   5star-ultra-mobile-v1.0.0  -> 5Star-Ultra-Mobile-v1.0.0.apk  (tv.fivestar.ultra.mobile)
#   supreme-tv-mobile-v1.0.0   -> Supreme-TV-Mobile-v1.0.0.apk   (tv.supreme.app.mobile)
# The in-app updater (MobileUpdateManager) reads only its own prefix and only its own asset name, so
# these names are a contract: change one here and the installed apps stop finding their updates.
#
# Releases are created as DRAFTS. GitHub never lists a draft to an anonymous client, so no installed
# app can see it; it reaches customers only when a person publishes it after testing the APK.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   MOBILE_KEYSTORE_BASE64   the PKCS12 keystore, base64-encoded (secret)
#   MOBILE_KEYSTORE_PASSWORD its store password (secret)
#   MOBILE_KEY_ALIAS         goattv-mobile (secret, so it is masked in logs)
#   MOBILE_KEY_PASSWORD      the key password (secret)
# Variable (not secret):
#   MOBILE_CERT_SHA256       the certificate's SHA-256 fingerprint, lowercase hex without colons.
#                            Every APK is checked against it, so a wrong keystore fails the run
#                            instead of shipping an APK that cannot update anyone.
# Optional secrets, as before: OWNTV_EDGE_MASTER / OWNTV_EDGE_KEY for the metadata service.
on:
  push:
    branches: [ main ]
    tags:
      - "goattv-mobile-v*"
      - "allaccess-mobile-v*"
      - "5star-ultra-mobile-v*"
      - "supreme-tv-mobile-v*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for all four brands (X.Y.Z). Artifacts only — never a release."
        required: true
        default: "1.0.0"

permissions:
  contents: read

# Core (tv.own.owntv:core, :player-core) and the mpv engine (tv.own.owntv:libmpv) resolve from OwnTV's
# public Maven repository, https://ahxn00.github.io/OwnTV_Core/maven — no token. There is no
# owntv.corePath here: CI deliberately builds against the PINNED artifact, which is what ships.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pin:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/core-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The pin must be core's newest release, and locales.json must match it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          PIN=$(sed -n 's/^owntvCore = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          [ -n "$PIN" ] || { echo "::error::Could not read owntvCore from gradle/libs.versions.toml."; exit 1; }

          # The branch name carries the version too, so a mismatch means the two halves of the bump
          # disagree about what is being pinned.
          if [ "$HEAD_BRANCH" != "bump/core-$PIN" ]; then
            echo "::error::Branch $HEAD_BRANCH does not match the pin $PIN."
            exit 1
          fi

          # Core publishes the release only AFTER its tests pass and both artifacts are pushed, so a
          # release existing is proof the version is real and installable.
          LATEST=$(gh api repos/ahXN00/OwnTV_Core/releases/latest --jq .tag_name)
          LATEST="${LATEST#core-}"
          if [ "$PIN" != "$LATEST" ]; then
            echo "::error::Pinned $PIN but core's newest release is $LATEST."
            exit 1
          fi

          # The other file the bump touches. It is duplicated into every consumer because Gradle
          # reads it at configure time to build localeFilters, and core's own copy never reaches
          # here. A stale copy silently strips a language out of the APK with a green build.
          curl -fsSL -o /tmp/locales.core.json \
            "https://raw.githubusercontent.com/ahXN00/OwnTV_Core/core-$PIN/tools/i18n/locales.json"
          if ! diff -u /tmp/locales.core.json tools/i18n/locales.json; then
            echo "::error::tools/i18n/locales.json differs from core's copy at core-$PIN."
            exit 1
          fi

          echo "Pin $PIN is core's newest release, the branch agrees, and locales.json matches."


  check:
    # Core pin bumps carry no application code — verify-pin above covers them instead.
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/core-')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every brand: each resolves its own BrandConfig, release track and resources. The ABI flavors
      # differ only in the packaged native libs, so standard is enough.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testGoatStandardDebugUnitTest testAllaccessStandardDebugUnitTest \
            testFivestarStandardDebugUnitTest testSupremeStandardDebugUnitTest --stacktrace

      # abortOnError = true in app/build.gradle.kts, so this fails the job on a lint error.
      - name: Lint
        if: always()   # report both verdicts in one run instead of one failure at a time
        run: ./gradlew lintGoatStandardDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  plan:
    needs: check
    # A brand tag, or a manual run. Pushes to main and pull requests stop at check: an APK is only
    # ever built with a real version and the production key.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      code: ${{ steps.plan.outputs.code }}
      is_tag: ${{ steps.plan.outputs.is_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Brands and version
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # brand-id flavor package tag-prefix asset-base display-name
          BRANDS='goat Goat tv.goat.tv.mobile goattv-mobile-v GoatTV-Mobile GoatTV_Mobile
          allaccess Allaccess tv.allaccess.app.mobile allaccess-mobile-v AllAccess-Mobile AllAccess_Mobile
          fivestar Fivestar tv.fivestar.ultra.mobile 5star-ultra-mobile-v 5Star-Ultra-Mobile 5Star_Ultra_Mobile
          supreme Supreme tv.supreme.app.mobile supreme-tv-mobile-v Supreme-TV-Mobile Supreme_TV_Mobile'

          # The updater inside every APK asks the repository named in gradle.properties. Building here
          # with any other value would ship apps that look for their updates somewhere else.
          CONFIGURED=$(sed -n 's/^goattv\.mobile\.releaseRepo=\(.*\)$/\1/p' gradle.properties | tr -d '[:space:]')
          if [ "${CONFIGURED,,}" != "${REPOSITORY,,}" ]; then
            echo "::error::gradle.properties has goattv.mobile.releaseRepo='$CONFIGURED' but this is $REPOSITORY."
            exit 1
          fi

          SELECTED=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            SELECTED="$BRANDS"
            IS_TAG=false
          else
            IS_TAG=true
            while read -r id flavor pkg prefix asset display; do
              if [[ "$REF_NAME" == "$prefix"* ]]; then
                VERSION="${REF_NAME#"$prefix"}"
                SELECTED="$id $flavor $pkg $prefix $asset $display"
              fi
            done <<< "$BRANDS"
            [ -n "$SELECTED" ] || { echo "::error::Tag $REF_NAME is on no Mobile brand's track."; exit 1; }
          fi

          if ! [[ "$VERSION" =~ ^([0-9]{1,4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Version '$VERSION' is not X.Y.Z (minor and patch at most 99)."
            exit 1
          fi
          CODE=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))

          MATRIX=$(while read -r id flavor pkg prefix asset display; do
            jq -cn --arg id "$id" --arg flavor "$flavor" --arg pkg "$pkg" --arg prefix "$prefix" \
              --arg asset "$asset" --arg display "${display//_/ }" \
              '{id:$id,flavor:$flavor,package:$pkg,prefix:$prefix,asset:$asset,display:$display}'
          done <<< "$SELECTED" | jq -cs '{include: .}')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (code $CODE); brands: $(echo "$MATRIX" | jq -r '[.include[].id] | join(", ")')"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      VERSION_NAME: ${{ needs.plan.outputs.version }}
      VERSION_CODE: ${{ needs.plan.outputs.code }}
      APK_NAME: ${{ matrix.asset }}-v${{ needs.plan.outputs.version }}.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Missing secrets are a failure, never an unsigned or debug-signed fallback. The keystore only
      # ever exists in this runner's temp directory and is deleted in the last step.
      - name: Decode the Mobile signing keystore
        env:
          MOBILE_KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          MOBILE_CERT_SHA256: ${{ vars.MOBILE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [ -n "$MOBILE_KEYSTORE_BASE64" ] || { echo "::error::MOBILE_KEYSTORE_BASE64 is not set."; exit 1; }
          [ -n "$MOBILE_CERT_SHA256" ] || { echo "::error::The MOBILE_CERT_SHA256 variable is not set."; exit 1; }
          echo "$MOBILE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/goattv-mobile-release.jks"
          echo "MOBILE_KEYSTORE_FILE=$RUNNER_TEMP/goattv-mobile-release.jks" >> "$GITHUB_ENV"

      # Derives this release's edge key for the shared metadata/subtitle service. Falls back to the
      # static OWNTV_EDGE_KEY, then to "", where core uses its open base URL.
      - name: Derive the release edge key
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            KEY=$(printf '%s' "$VERSION_NAME" \
              | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex \
              | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
          elif [ -n "$OWNTV_EDGE_KEY" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY" >> "$GITHUB_ENV"
          else
            echo "No edge secret configured — the app will use the unprotected base URL."
          fi

      - name: Build the signed release APK
        env:
          MOBILE_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # verifyMobileRelease (app/build.gradle.kts) refuses to run without signing, a version and
          # the release repository, so this cannot quietly produce an unsigned APK.
          ./gradlew ":app:assemble${{ matrix.flavor }}StandardRelease" --stacktrace
          SRC=$(ls app/build/outputs/apk/${{ matrix.id }}Standard/release/*.apk | head -n1)
          mkdir -p dist
          cp "$SRC" "dist/$APK_NAME"

      # The three things that make an APK an update for the installed app, checked on the file itself.
      - name: Verify package, version and certificate
        env:
          MOBILE_CERT_SHA256: ${{ vars.MOBILE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          APK="dist/$APK_NAME"
          BADGING=$("$BT/aapt2" dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='${{ matrix.package }}' " \
            || { echo "::error::$APK is not ${{ matrix.package }}."; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$VERSION_CODE' " \
            || { echo "::error::$APK does not carry versionCode $VERSION_CODE."; exit 1; }
          echo "$BADGING" | grep -q "versionName='$VERSION_NAME' " \
            || { echo "::error::$APK does not carry versionName $VERSION_NAME."; exit 1; }

          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          EXPECTED=$(echo "$MOBILE_CERT_SHA256" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          SIGNERS=$(grep -o '^Signer #[0-9]*' certs.txt | sort -u | wc -l)
          if [ "$SIGNERS" != "1" ] || [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::$APK is not signed with the Mobile production key alone (got $ACTUAL)."
            exit 1
          fi
          ( cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          cat "dist/$APK_NAME.sha256"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/goattv-mobile-release.jks"

  release:
    needs: [ plan, build ]
    if: ${{ needs.plan.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that may create a (draft) release
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A DRAFT, with exactly one APK: this tag's brand. Invisible to every installed app until a
      # person publishes it — after installing this exact file over the previous version on a device.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          DISPLAY_NAME=$(echo "$MATRIX" | jq -r '.include[0].display')
          ASSET=$(echo "$MATRIX" | jq -r '.include[0].asset')-v$VERSION.apk
          [ -f "dist/$ASSET" ] || { echo "::error::dist/$ASSET is missing."; exit 1; }
          printf '%s %s\n\nSHA-256: %s\n' "$DISPLAY_NAME" "$VERSION" "$(cut -d' ' -f1 "dist/$ASSET.sha256")" > notes.md
          gh release create "$TAG" "dist/$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$DISPLAY_NAME $VERSION" \
            --notes-file notes.md
